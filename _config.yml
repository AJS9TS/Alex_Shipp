bio: >
  I'm a Business Analyst with experience delivering data and analytics products across customer and operational domains. I am skilled at translating complex business challenges into requirements documents, I bridge the gap between non-technical business stakeholders and technical teams, combining strong business analysis and product thinking to drive measurable outcomes.  My experience spans Advanced Driver Assistance Systems (ADAS), Damage Assessment, Conversion Optimisation, and Data Quality, where I have led requirements gathering, process discovery, stakeholder engagement, and global product adoption initiatives across multiple international business units. 
  
  Recent highlights include working on an AI-enabled Damage Assessment proof-of-concept, delivering global ADAS and Data Quality dashboards to improve operational transparency, and developing conversion analytics capabilities that provide actionable insights into a country's performance.

