bio: |
  I'm a Business Analyst who turns business problems into clear requirements that technical teams can build from. I act as the go-to between business and technical teams, making sure both sides understand each other and that what gets delivered matches what was needed. My experience predominantly covers the automotive industry, where I've led requirements gathering, process discovery, stakeholder engagement, and product adoption on Conversion and ADAS projects across multiple international business units.

  Recent highlights include working on an AI-enabled Damage Assessment proof-of-concept, delivering global ADAS and Data Quality dashboards to improve operational transparency, and helping design conversion analytics capabilities that provide actionable insights into a country's performance.

