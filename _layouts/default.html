<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <header class="nav">
    <div class="wrap">
      <a class="nav-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="nav-links">
        <a href="{{ '/' | relative_url }}#about">About</a>
        <a href="{{ '/' | relative_url }}#projects">Projects</a>
        {% if site.linkedin %}<a href="{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>{% endif %}
        <a href="https://www.linkedin.com/in/alexander-shipp-557832209/details/recommendations/" target="_blank" rel="noopener">Testimonials</a>
        <a class="nav-cta" href="mailto:{{ site.email }}">Email me</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      &copy; {{ 'now' | date: "%Y" }} {{ site.title }}
    </div>
  </footer>

  <script>
  document.addEventListener('mouseover', function(e) {
    const link = e.target.closest('a');
    if (link && link.href && !link.dataset.prefetched) {
      const prefetch = document.createElement('link');
      prefetch.rel = 'prefetch';
      prefetch.href = link.href;
      document.head.appendChild(prefetch);
      link.dataset.prefetched = 'true';
    }
  });

  // Scroll-reveal with IntersectionObserver
  (function() {
    var reveals = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) {
      // Fallback: show everything immediately
      reveals.forEach(function(el) { el.classList.add('visible'); });
      return;
    }
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    reveals.forEach(function(el) { observer.observe(el); });
  })();

  // Smooth page transitions
  (function() {
    document.addEventListener('click', function(e) {
      var link = e.target.closest('a');
      if (!link) return;
      var href = link.getAttribute('href');
      // Skip external links, hash links, new-tab links, mailto, etc.
      if (link.target === '_blank') return;
      if (href.startsWith('#')) return;
      if (href.startsWith('mailto:')) return;
      if (link.hostname !== window.location.hostname) return;
      // Skip links that are just anchors on the current page
      if (link.pathname === window.location.pathname && link.hash) return;

      e.preventDefault();
      document.body.classList.add('page-leaving');
      setTimeout(function() {
        window.location.href = link.href;
      }, 300);
    });

    // Fade in on page load
    window.addEventListener('pageshow', function(e) {
      document.body.classList.remove('page-leaving');
    });
  })();
  </script>
</body>
</html>
